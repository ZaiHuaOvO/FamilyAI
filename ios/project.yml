name: FamilyAI
options:
  bundleIdPrefix: com.familyai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      ENABLE_TESTABILITY: NO
targets:
  FamilyAI:
    type: application
    platform: iOS
    sources:
      - path: FamilyAI
        excludes:
          - Info.plist
          - FamilyAI.entitlements
    settings:
      base:
        PRODUCT_NAME: FamilyAI
        PRODUCT_BUNDLE_IDENTIFIER: com.familyai.app
        INFOPLIST_FILE: FamilyAI/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FamilyAI/FamilyAI.entitlements
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ALWAYS_SEARCH_USER_PATHS: NO
  FamilyAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FamilyAITests
    dependencies:
      - target: FamilyAI
    settings:
      base:
        PRODUCT_NAME: FamilyAITests
        PRODUCT_BUNDLE_IDENTIFIER: com.familyai.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
  FamilyAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FamilyAIUITests
    dependencies:
      - target: FamilyAI
    settings:
      base:
        PRODUCT_NAME: FamilyAIUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.familyai.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FamilyAI
schemes:
  FamilyAI:
    build:
      targets:
        FamilyAI: all
        FamilyAITests: [test]
        FamilyAIUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FamilyAITests
        - FamilyAIUITests
    archive:
      config: Release
