name: FamilyAI
options:
  bundleIdPrefix: com.familyai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  FamilyAI:
    type: application
    platform: iOS
    sources:
      - path: FamilyAI
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_NAME: FamilyAI
        PRODUCT_BUNDLE_IDENTIFIER: com.familyai.app
        INFOPLIST_FILE: FamilyAI/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: complete
schemes:
  FamilyAI:
    build:
      targets:
        FamilyAI: all
    run:
      config: Debug
    archive:
      config: Release
